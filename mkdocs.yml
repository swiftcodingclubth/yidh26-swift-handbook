site_name: Swift Workshop Handbook
site_description: คู่มือ workshop และ code snippets สำหรับผู้เข้าร่วม Hackathon
site_url: https://tawapnas.github.io/yidh26-swift-handbook/
repo_url: https://github.com/tawapnas/yidh26-swift-handbook

theme:
  name: material
  language: th
  icon:
    logo: material/language-swift
  # LINE Seed Sans TH ไม่มีใน Google Fonts จึงโหลดเองใน extra.css
  font: false
  # โหมดมืดอย่างเดียว ไม่มีปุ่มสลับ
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tool-sort.js

plugins:
  - search
  # ใช้ค่าใน extra ในหน้าเอกสารได้ เช่น {{ mac.apple }}
  - macros

# ชื่อเครื่องที่ใช้ทั้ง handbook แก้ที่นี่ที่เดียว
extra:
  mac:
    apple: MacBook (Apple Silicon)
    intel: MacBook (Intel)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # ดึง code จาก starter repos มาแสดงตรงๆ เพื่อให้ snippet ตรงกับโค้ดที่ compile ได้จริง
  - pymdownx.snippets:
      base_path: [".", "../starter-repos"]

nav:
  - หน้าแรก: index.md
  - เริ่มต้นใช้งาน: getting-started.md
  - "Workshop 1: Coding agents":
      - workshop-1/index.md
      - Hardware: workshop-1/hardware.md
      - Git & GitHub: workshop-1/git.md
      - Xcode agents: workshop-1/xcode-agents.md
      - OpenCode: workshop-1/opencode.md
      - Prompting & best practices: workshop-1/prompting.md
  - "Workshop 2: Foundation Models & on-prem AI":
      - workshop-2/index.md
      - เลือก model: workshop-2/models.md
      - Foundation Models: workshop-2/foundation-models.md
      - Tool calling: workshop-2/tool-calling.md
      - Dynamic Profile: workshop-2/dynamic-profiles.md
      - HackathonAI: workshop-2/hackathon-ai.md
  - "Workshop 3: Sensors, Create ML & Core AI":
      - workshop-3/index.md
      - Core Motion: workshop-3/core-motion.md
      - Sound recognition: workshop-3/sound.md
      - LiDAR: workshop-3/lidar.md
      - Create ML: workshop-3/create-ml.md
      - Core ML: workshop-3/core-ml.md
      - Core AI: workshop-3/core-ai.md
  - "Workshop 5: Vision & VisionKit":
      - workshop-5/index.md
      - VisionKit: workshop-5/visionkit.md
      - อ่านข้อความจากรูป: workshop-5/text-recognition.md
      - Hand pose: workshop-5/hand-pose.md
      - ใส่ใน app ของทีม: workshop-5/add-to-your-app.md
